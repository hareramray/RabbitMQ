name: rmqcourse-cluster

x-node: &node
  image: rabbitmq:4.2.9-management
  restart: unless-stopped
  environment: &environment
    RABBITMQ_DEFAULT_USER: student
    RABBITMQ_DEFAULT_PASS: student-local-only
    RABBITMQ_DEFAULT_VHOST: learning
    RABBITMQ_ERLANG_COOKIE: rmqcourse-local-cluster-cookie-only
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  rmq1:
    <<: *node
    hostname: rmq1
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rmq1
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rmq1-data:/var/lib/rabbitmq"]
  rmq2:
    <<: *node
    hostname: rmq2
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rmq2
    ports: ["127.0.0.1:5674:5672", "127.0.0.1:15674:15672"]
    volumes: ["rmq2-data:/var/lib/rabbitmq"]
  rmq3:
    <<: *node
    hostname: rmq3
    environment:
      <<: *environment
      RABBITMQ_NODENAME: rabbit@rmq3
    ports: ["127.0.0.1:5675:5672", "127.0.0.1:15675:15672"]
    volumes: ["rmq3-data:/var/lib/rabbitmq"]

volumes:
  rmq1-data:
  rmq2-data:
  rmq3-data:
